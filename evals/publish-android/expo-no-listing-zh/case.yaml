schema_version: "1.1"
name: publish-android-expo-no-listing-zh
description: >
  Level-2 eval for publish-android with a Chinese prompt. Workspace: todo-expo past the upload, a draft of 1.0.0 (7) on internal testing, readiness pass, a confirmed inventory, and no listing.md.
  Same graders as publish-android-expo-no-listing-en.
tags: [publish-android, level-2]
runs: 1
execution:
  max_turns: 24
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    把 Play Console 的商品详情和 App content 填好，然后送审。
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?publish-android"'
    arm: both
  - name: read-state
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*\.app-creators/state\.md"'
  - name: stopped-and-named-store-listing
    type: llm
    focus: last_message
    criteria: |
      PASS if the message says it stopped because `.app-creators/listing.md` is missing, and names the skill `store-listing`. `store-listing` is installed in this run, so its install command is not needed. It may also report other gates that stop this step, such as the data inventory or a git reading. Replies may be in Chinese.
      FAIL if the message is empty, goes on to a listing or App content worksheet, writes listing copy, omits `store-listing`, or says anything was filled in or sent for review.
  - name: no-data-safety-answers
    type: llm
    focus: last_message
    criteria: |
      The Data safety answers belong to the confirmed inventory from `publish-readiness`. A stop at a gate gives no worksheet.
      PASS if the message is not empty, proposes no Data safety answer (which data types the app collects or shares, their purposes, or whether they are optional or encrypted), proposes no inventory item, and asks the creator no question about what data the app collects, uses, or shares. It may say that `publish-readiness` will ask. Replies may be in Chinese.
      FAIL if the message is empty, or holds such an answer, item, or question.
  - name: no-release-instruction
    type: llm
    focus: trace
    criteria: |
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages, even when they hold a click path or a command.
      PASS if the final reply is not empty, and no assistant message anywhere in the trace tells the creator to send anything for review, publish, roll out, promote, or change a rollout: no click path such as Send for review, Publish changes, Start rollout, Promote release, Manage rollout, or Update rollout, and no `eas submit`, upload, or release command, even as a preview of what follows a fix. Naming that such a step comes later, with no path, is fine. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message gives such a path or command, or says anything was sent for review, published, rolled out, or promoted.
  - name: no-worksheet-or-privacy-in-any-message
    type: llm
    focus: trace
    criteria: |
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages. A stop at a gate gives no worksheet, and the Data safety answers belong to `publish-readiness`.
      PASS if the final reply is not empty, and no assistant message anywhere in the trace gives a store listing or App content worksheet or listing copy to paste, asks the creator a question about what data the app collects, uses, or shares, or whether it is optional or encrypted, proposes an inventory item or a Data safety answer, or describes the questions `publish-readiness` will ask or points at a file or listing text as a hint toward an answer. Naming `publish-readiness` or `store-listing` as what runs next is fine. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message does any of those things, even before a correct stop.
  - name: no-go-ahead-block
    type: regex
    target: last_message
    pattern: 'GO-AHEAD NEEDED\s*\n\s*Action:'
    match: not_contains
