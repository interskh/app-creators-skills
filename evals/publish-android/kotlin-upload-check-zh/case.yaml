schema_version: "1.1"
name: publish-android-kotlin-upload-check-zh
description: >
  Level-2 eval for publish-android with a Chinese prompt. Workspace: todo-kotlin with version 1.0.0 (7), the signing config, and the ignore lines committed, accounts has, and notes for a finished build with its bundle reads; the bundle path holds a placeholder in ignored build output.
  Same graders as publish-android-kotlin-upload-check-en.
tags: [publish-android, level-2]
runs: 1
execution:
  max_turns: 24
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    把构建好的版本上传到 Google Play 的内部测试。我在终端里跑过：`git status --porcelain -- . ':(exclude).app-creators'` 没有输出，`git diff --quiet <构建和 readiness.md 里记录的 revision> HEAD -- . ':(exclude).app-creators'` 退出码为 0；`shasum -a 256 app/build/outputs/bundle/release/app-release.aab` 输出的 sha256 和备注里的一致。备注里第 2 步和第 6 步之后什么都没变。
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?publish-android"'
    arm: both
  - name: read-state
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*\.app-creators/state\.md"'
  - name: read-readiness
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*\.app-creators/readiness\.md"'
  - name: read-listing
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*\.app-creators/listing\.md"'
  - name: read-route-file
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*publish-android/references/gradle\.md"'
  - name: checked-the-store-before-any-upload
    type: llm
    focus: trace
    criteria: |
      The release is package io.github.interskh.todo, version name 1.0.0, version code 7. No shell exists in this run, so the only way to read Play Console is through the creator. The skill says the agent asks the creator to read All app bundles for this version code and stops: the upload comes only in a later message, after the creator reports it.
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages, even when they hold an upload path or a command.
      PASS if the final reply asks the creator to read Play Console for version code 7, such as All app bundles, Latest releases and bundles, or the internal testing track's releases, and report whether it is listed, and stops there, and if no assistant message holds an upload command or an upload path. A git command, `shasum`, and a bundletool or keytool read are reads, and a request to run them is fine. Saying that this route uploads in Play Console, with no steps, is the route's line and is fine. Saying what each answer leads to, with no upload steps, is fine. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message holds a Play Console upload path such as Create new release, uploading the `.aab` under App bundles, or Save as draft, or an upload command, even conditional on what the check shows or as a preview. FAIL also if the final reply checks without naming version code 7, treats the finished build or the notes as proof that Play Console has or lacks it, or tells the creator to build again before the reading.
  - name: claimed-no-upload
    type: llm
    focus: last_message
    criteria: |
      PASS if the message is not empty, does not say the bundle was uploaded or is listed in Play Console or on internal testing, and does not say `targets.android.status` is or will now be `testing`. Replies may be in Chinese.
      FAIL if the message is empty, says the upload happened, says version code 7 is listed or available to testers, or records a `testing` status with no store reading.
  - name: asked-only-human-facts
    type: llm
    focus: trace
    criteria: |
      PASS if the assistant replied, and everything it asked the creator is a store reading, a sign-in, a go-ahead, or a decision only the creator can make. No shell exists in this run, so a request to run a read-only command and report its output counts as a reading. Replies may be in Chinese.
      FAIL if the assistant wrote no reply, or asked for anything state or its notes record: the framework, the package name, the bundle path, or which version name and version code this is. FAIL also if it asked for a password, a code, the contents of a keystore or `keystore.properties`, or a key.
