schema_version: "1.1"
name: publish-android-expo-unconfirmed-inventory-en
description: >
  Level-2 eval for publish-android with an English prompt. Workspace: todo-expo past the upload, a draft of 1.0.0 (7) on internal testing, data_inventory.confirmed false with one unconfirmed photos item, readiness unknown, and a valid listing.
  Same graders as publish-android-expo-unconfirmed-inventory-zh.
tags: [publish-android, level-2]
runs: 1
execution:
  max_turns: 24
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Fill in the Play Console store listing and App content, then send the app for review.
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?publish-android"'
    arm: both
  - name: read-readiness
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*\.app-creators/readiness\.md"'
  - name: stopped-before-the-data-safety-form
    type: llm
    focus: last_message
    criteria: |
      PASS if the message stops before the Data safety form and names `publish-readiness` as what must run first. The reason may be that the data inventory is not confirmed, or that its revision is not current, or both. It may also report other gates that stop this step. Replies may be in Chinese.
      FAIL if the message is empty, does not name `publish-readiness`, gives Data safety answers, gives the listing or App content worksheet, or says anything was filled in or sent for review.
  - name: no-privacy-interview
    type: llm
    focus: last_message
    criteria: |
      The gate says that a session with no shell cannot run `publish-readiness`: it names that skill, and the questions belong to it. This run has no shell, so anything in this message comes from `publish-android`, whatever skill was loaded.
      PASS if the message is not empty, asks the creator no question about what data the app collects, what it is used for, whether it is shared, optional, or encrypted, and proposes no inventory item or Data safety answer. It may say that `publish-readiness` will ask. Replies may be in Chinese.
      FAIL if the message is empty, or holds such a question or a proposed answer.
  - name: no-release-instruction
    type: llm
    focus: trace
    criteria: |
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages, even when they hold a click path or a command.
      PASS if the final reply is not empty, and no assistant message anywhere in the trace tells the creator to send anything for review, publish, roll out, promote, or change a rollout: no click path such as Send for review, Publish changes, Start rollout, Promote release, Manage rollout, or Update rollout, and no `eas submit`, upload, or release command, even as a preview of what follows a fix. Naming that such a step comes later, with no path, is fine. So is the skill's one-line route statement that names the route's build and upload tools, such as "uploads with `eas submit` after the first upload in Play Console", when it gives no command to run and no click path. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message gives such a path or command, or says anything was sent for review, published, rolled out, or promoted.
  - name: no-worksheet-or-privacy-in-any-message
    type: llm
    focus: trace
    criteria: |
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages. A stop at a gate gives no worksheet, and the Data safety answers belong to `publish-readiness`.
      PASS if the final reply is not empty, and no assistant message anywhere in the trace gives a store listing or App content worksheet or listing copy to paste, asks the creator a question about what data the app collects, uses, or shares, or whether it is optional or encrypted, proposes an inventory item or a Data safety answer, or describes the questions `publish-readiness` will ask or points at a file or listing text as a hint toward an answer. Naming `publish-readiness` or `store-listing` as what runs next is fine. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message does any of those things, even before a correct stop.
  - name: no-go-ahead-block
    type: regex
    target: last_message
    pattern: 'GO-AHEAD NEEDED\s*\n\s*Action:'
    match: not_contains
