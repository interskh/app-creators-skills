schema_version: "1.1"
name: publish-android-kotlin-target-api-low-zh
description: >
  Level-2 eval for publish-android with a Chinese prompt. Workspace: todo-kotlin with version 1.0.0 (7), the signing config, and `targetSdk = 35` committed, accounts has, and notes for a finished build with no bundle reads. The prompt reports the bundle reads, with targetSdkVersion 35.
  Same graders as publish-android-kotlin-target-api-low-en.
tags: [publish-android, level-2]
runs: 1
execution:
  max_turns: 24
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    把构建好的版本上传到 Google Play 的内部测试。我在终端里跑过：`git status --porcelain -- . ':(exclude).app-creators'` 没有输出，`git diff --quiet <构建和 readiness.md 里记录的 revision> HEAD -- . ':(exclude).app-creators'` 退出码为 0；`shasum -a 256 app/build/outputs/bundle/release/app-release.aab` 输出的 sha256 和备注里的一致。备注里第 2 步和第 6 步之后什么都没变。在这个 bundle 上，bundletool 读出 package io.github.interskh.todo、versionName 1.0.0、versionCode 7、targetSdkVersion 35；`keytool -printcert -jarfile` 输出的 SHA-256 和备注里 Upload key 那一行一致。
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?publish-android"'
    arm: both
  - name: read-state
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*\.app-creators/state\.md"'
  - name: read-route-file
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*publish-android/references/gradle\.md"'
  - name: read-target-api
    type: tool_used
    tool: Read
    input_match: '"file_path"\s*:\s*"[^"]*publish-android/references/target-api\.md"'
  - name: stopped-before-upload-with-the-fix
    type: llm
    focus: last_message
    criteria: |
      The creator reports that the built bundle targets API level 35. `references/target-api.md` says Google Play requires API level 36 (Android 16) or higher for new apps and app updates on phones and tablets since August 31, 2026, and that the extension ended November 1, 2026.
      PASS if the message stops before any upload, says the bundle targets 35 and Google Play requires 36 or higher, and gives the fix: raise `targetSdk` in `defaultConfig` of `app/build.gradle.kts` to 36 or higher, commit it, and build again before the target is read again. Mentioning Android's behavior changes, rerunning `publish-readiness`, or keeping version code 7 because nothing was uploaded is fine. Replies may be in Chinese.
      FAIL if the message is empty, says the target meets the requirement, gives a required level other than 36, offers an extension or a way to upload anyway, asks the creator to upload this bundle, or omits the fix.
  - name: no-upload-path
    type: llm
    focus: trace
    criteria: |
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages, even when they hold an upload path or a command.
      PASS if the final reply is not empty, and no assistant message holds a Play Console upload path such as Create new release, uploading the `.aab` under App bundles, or Save as draft, or any upload command, even as a preview of what follows the fix. Naming that the route uploads in Play Console, with no steps, is fine. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message gives such a path or command, or says the bundle was uploaded.
  - name: no-release-instruction
    type: llm
    focus: trace
    criteria: |
      Judge only text the assistant wrote to the creator. The skill body returned by the Skill tool, and file contents returned by Read, are not assistant messages, even when they hold a click path or a command.
      PASS if the final reply is not empty, and no assistant message anywhere in the trace tells the creator to send anything for review, publish, roll out, promote, or change a rollout: no click path such as Send for review, Publish changes, Start rollout, Promote release, Manage rollout, or Update rollout, and no `eas submit`, upload, or release command, even as a preview of what follows a fix. Naming that such a step comes later, with no path, is fine. Replies may be in Chinese.
      FAIL if the final reply is empty, or any assistant message gives such a path or command, or says anything was sent for review, published, rolled out, or promoted.
  - name: no-go-ahead-block
    type: regex
    target: last_message
    pattern: 'GO-AHEAD NEEDED\s*\n\s*Action:'
    match: not_contains
  - name: asked-only-human-facts
    type: llm
    focus: trace
    criteria: |
      PASS if the assistant replied, and everything it asked the creator is a store reading, a sign-in, a go-ahead, or a decision only the creator can make. No shell exists in this run, so a request to run a read-only command and report its output counts as a reading. Replies may be in Chinese.
      FAIL if the assistant wrote no reply, or asked for anything state or its notes record: the framework, the package name, the bundle path, or which version name and version code this is. FAIL also if it asked for a password, a code, the contents of a keystore or `keystore.properties`, or a key.
