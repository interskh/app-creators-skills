schema_version: "1.1"
name: app-creators-vite-en
description: >
  Level-2 eval for app-creators with an English prompt. The workspace is the
  fixture ../app-creators-fixtures/todo-vite at commit 95c2f95 with NO
  .app-creators/state.md, so the skill must create it. Checks that the skill
  fires, writes state.md with schema 1.0, framework vite, package manager
  npm, slug todo-vite, web intent wanted, web status unknown, and goal
  publish, asks the creator nothing beyond the two questions, and names
  publish-web as the next skill without claiming any external outcome.
tags: [app-creators, level-2]
runs: 1
execution:
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    I want to publish this app on the web. Set up App Creators for this project and tell me what to run next.
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?app-creators"'
    arm: both
  - name: state-created
    type: file_exists
    path: .app-creators/state.md
  - name: schema-1-0
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?schema:[ \t]*["'']1\.0["''][ \t]*(?:#[^\n]*)?\r?$'
    flags: m
  - name: kind-vite
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?[ \t]*kind:[ \t]*["'']?vite["'']?[ \t]*(?:#[^\n]*)?\r?$'
    flags: m
  - name: package-manager-npm
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?[ \t]*package_manager:[ \t]*["'']?npm["'']?[ \t]*(?:#[^\n]*)?\r?$'
    flags: m
  - name: slug-todo-vite
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?[ \t]*slug:[ \t]*["'']?todo-vite["'']?[ \t]*(?:#[^\n]*)?\r?$'
    flags: m
  - name: web-intent-wanted
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?([ \t]*)web:[ \t]*(?:#[^\n]*)?\r?\n(?:\1[ \t]+[^\n]*\n|[ \t]*\r?\n)*?\1[ \t]+intent:[ \t]*["'']?wanted\b'
    flags: m
  - name: web-status-unknown
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?([ \t]*)web:[ \t]*(?:#[^\n]*)?\r?\n(?:\1[ \t]+[^\n]*\n|[ \t]*\r?\n)*?\1[ \t]+status:[ \t]*["'']?unknown\b'
    flags: m
  - name: goal-publish
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---[ \t]*\r?$)[^\n]*\r?\n)*?goal:[ \t]*["'']?publish["'']?[ \t]*(?:#[^\n]*)?\r?$'
    flags: m
  - name: asks-only-the-two-questions
    type: llm
    focus: trace
    criteria: |
      PASS if the assistant asked the creator nothing, or asked only about the outcome wanted (publish, get users, or make money) and/or the destinations wanted (web, iOS, Android), or asked only for confirmation to proceed. The prompt already answers both questions, so inferring them without asking also passes.
      FAIL if the assistant asked which framework, package manager, build tool, or output directory the project uses, asked the creator for an account, token, or secret, or asked about anything else.
  - name: names-publish-web-no-outcome-claims
    type: llm
    focus: trace
    criteria: |
      PASS if the assistant's final reply names `publish-web` as the next skill or step to run, and no assistant message anywhere in the trace claims the app is published, deployed, live, listed, or online, or gives a live URL.
      FAIL if the final reply names a different next skill or none, invents a skill name that the App Creators plugin does not ship (other skills labelled "not shipped yet" are fine), or any assistant message in the trace claims an external outcome, such as saying the app is published, deployed, or live, or giving a live URL.
