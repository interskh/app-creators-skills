schema_version: "1.1"
name: vite-zh
description: >
  Level-2 eval for publish-web with a Chinese prompt (bilingual parity, spec
  §3.4). The workspace is the fixture ../app-creators-fixtures/todo-vite at
  commit 95c2f95 plus a .app-creators/state.md written as app-creators would
  leave it. Same graders as vite-en.
tags: [publish-web, level-2]
runs: 1
execution:
  max_turns: 12
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
  prompt: |
    帮我把这个应用发布上线，要能作为 PWA 安装。
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?publish-web"'
    arm: both
  - name: read-state
    type: tool_used
    tool: Read
    input_match: 'state\.md'
  - name: names-vercel
    type: regex
    pattern: 'vercel'
    flags: i
    target: last_message
  - name: asks-only-human-prerequisites
    type: llm
    focus: trace
    criteria: |
      PASS if every question the assistant put to the creator is about a human-only prerequisite or decision (an account, a custom domain, DNS access, the app's display name or short name) or is a confirmation to proceed, or if the assistant asked no question at all.
      FAIL if the assistant asked which framework, package manager, build command, or output directory the project uses, or asked the creator for a token or secret value.
  - name: ran-verify-script
    type: tool_used
    tool: Bash
    input_match: 'check-pwa\.sh'
