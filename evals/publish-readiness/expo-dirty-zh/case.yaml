schema_version: "1.1"
name: publish-readiness-expo-dirty-zh
description: >
  Level-2 eval for publish-readiness with a Chinese prompt. Workspace: todo-expo with an earlier report committed at pass, plus an uncommitted change to App.tsx.
  Same graders as publish-readiness-expo-dirty-en.
tags: [publish-readiness, level-2]
runs: 1
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  prompt: |
    再跑一遍 App Store 和 Google Play 的就绪检查，把报告更新一下。
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?publish-readiness"'
    arm: both
  - name: ran-check-script
    type: tool_used
    tool: Bash
    input_match: 'check-readiness\.py[^\n]*--platform\b'
  - name: ios-unknown-in-readiness
    type: regex
    target: { source: file, path: .app-creators/readiness.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---)[^\n]*\n)*?(?:platforms:[ \t]*(?:#[^\r\n]*)?\r?\n(?:(?:[ \t][^\r\n]*)?\r?\n)*?([ \t]+)ios:[ \t]*(?:\{[ \t]*result:[ \t]*["'']?unknown\b|(?:#[^\r\n]*)?\r?\n\1[ \t]+result:[ \t]*["'']?unknown\b)|platforms:[ \t]*\{[^\r\n]*?\bios:[ \t]*\{[ \t]*result:[ \t]*["'']?unknown\b)'
    flags: m
  - name: ios-unknown-in-state
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---)[^\n]*\n)*?(?:readiness:[ \t]*(?:#[^\r\n]*)?\r?\n(?:(?:[ \t][^\r\n]*)?\r?\n)*?([ \t]+)ios:[ \t]*(?:\{[ \t]*result:[ \t]*["'']?unknown\b|(?:#[^\r\n]*)?\r?\n\1[ \t]+result:[ \t]*["'']?unknown\b)|readiness:[ \t]*\{[^\r\n]*?\bios:[ \t]*\{[ \t]*result:[ \t]*["'']?unknown\b)'
    flags: m
  - name: android-unknown-in-readiness
    type: regex
    target: { source: file, path: .app-creators/readiness.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---)[^\n]*\n)*?(?:platforms:[ \t]*(?:#[^\r\n]*)?\r?\n(?:(?:[ \t][^\r\n]*)?\r?\n)*?([ \t]+)android:[ \t]*(?:\{[ \t]*result:[ \t]*["'']?unknown\b|(?:#[^\r\n]*)?\r?\n\1[ \t]+result:[ \t]*["'']?unknown\b)|platforms:[ \t]*\{[^\r\n]*?\bandroid:[ \t]*\{[ \t]*result:[ \t]*["'']?unknown\b)'
    flags: m
  - name: android-unknown-in-state
    type: regex
    target: { source: file, path: .app-creators/state.md }
    pattern: '(?<![\s\S])---[ \t]*\r?\n(?:(?!---)[^\n]*\n)*?(?:readiness:[ \t]*(?:#[^\r\n]*)?\r?\n(?:(?:[ \t][^\r\n]*)?\r?\n)*?([ \t]+)android:[ \t]*(?:\{[ \t]*result:[ \t]*["'']?unknown\b|(?:#[^\r\n]*)?\r?\n\1[ \t]+result:[ \t]*["'']?unknown\b)|readiness:[ \t]*\{[^\r\n]*?\bandroid:[ \t]*\{[ \t]*result:[ \t]*["'']?unknown\b)'
    flags: m
  - name: asked-creator-to-commit
    type: llm
    focus: trace
    criteria: |
      PASS if the assistant told the creator that a pass cannot be recorded because of uncommitted changes, such as in `App.tsx`, and asked them to commit. The replies may be in Chinese.
      FAIL if the assistant does not ask the creator to commit, or committed the change itself.
