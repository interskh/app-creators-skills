name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint rule tests
        run: bash tests/lint-skills.test.sh
      - name: metrics tests
        run: bash tests/metrics.test.sh
      - name: check-pwa tests
        run: bash tests/check-pwa.test.sh
      - name: check-readiness tests
        run: bash tests/check-readiness.test.sh
      - name: check-listing tests
        run: bash tests/check-listing.test.sh
      - name: Lint skills
        run: bash scripts/lint-skills.sh
      - name: Lint template
        run: bash scripts/lint-skills.sh templates/skill
      - name: Plugin manifests parse
        run: python3 -I -c 'import json;[json.load(open(p)) for p in (".claude-plugin/plugin.json",".claude-plugin/marketplace.json")]'
